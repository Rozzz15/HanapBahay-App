[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["cd server && npm ci --only=production || npm install --only=production"]

[phases.build]
cmds = ["echo 'Build phase - no build needed for Node.js server'"]

[start]
cmd = "cd server && node server.js"

[variables]
NODE_ENV = "production"
